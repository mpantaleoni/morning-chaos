<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Morning Chaos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chaos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fff4e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1712" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #fff4e6;
    --card: #ffffff;
    --text: #2b211a;
    --muted: #8a7766;
    --line: #f0dfc8;
    --accent: #ef6f3c;
    --accent-ink: #ffffff;
    --good: #3f9d5b;
    --warn: #e2a51b;
    --bad: #d6453d;
    --tile: #fffaf3;
    --here: #ffe2c7;
    --shadow: 0 1px 2px rgba(80, 40, 10, .08), 0 6px 18px rgba(80, 40, 10, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1712;
      --card: #2a231c;
      --text: #f6ece1;
      --muted: #b29e8a;
      --line: #3d3329;
      --accent: #ff8a5a;
      --accent-ink: #1c1712;
      --good: #6cc488;
      --warn: #f0c24b;
      --bad: #ff6b61;
      --tile: #241e18;
      --here: #4a3423;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  #app {
    max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left));
  }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 18px; font-weight: 650; box-shadow: var(--shadow); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  h1, h2, h3 { margin: 0; }

  /* title */
  .title { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; text-align: center; padding: 32px 0; }
  .title .big { font-size: 64px; line-height: 1; }
  .title h1 { font-size: 40px; letter-spacing: -1px; font-weight: 800; }
  .langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
  .langs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--muted); }
  .langs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* calendar */
  .head { display: flex; align-items: center; gap: 8px; padding: 14px 0 10px; }
  .head .grow { flex: 1; font-weight: 700; font-size: 20px; }
  .pill { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
  .week { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .week h3 { font-size: 16px; }
  .week p { margin: 2px 0 10px; font-size: 13px; color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .day { border: 1px solid var(--line); background: var(--tile); border-radius: 12px; padding: 8px 2px; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .day b { font-size: 13px; }
  .day .st { font-size: 11px; letter-spacing: -1px; }
  .day:disabled { opacity: .4; cursor: default; }
  .day.next { border-color: var(--accent); border-width: 2px; }

  /* intro / results */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 18px; box-shadow: var(--shadow); }
  .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 0; }
  .twist { background: var(--here); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .stars { font-size: 40px; text-align: center; letter-spacing: 4px; }
  .disaster { border-left: 4px solid var(--bad); padding: 6px 12px; font-style: italic; }

  /* game */
  .hud { display: flex; align-items: center; gap: 10px; padding: 10px 0 8px; }
  .clock { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .clock.hot { color: var(--bad); }
  .meter { flex: 1; min-width: 0; }
  .meter small { font-size: 11px; color: var(--muted); display: block; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; background: var(--good); border-radius: 99px; transition: background .3s; }
  .house { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .room { position: relative; background: var(--tile); border: 1px solid var(--line); border-radius: 16px; padding: 8px; min-height: 132px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .room.here { background: var(--here); border-color: var(--accent); }
  .room .rn { font-size: 13.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0; display: flex; align-items: center; line-height: 1.15; min-height: 28px; }
  .room.here .rn, .room.going .rn { padding-right: 26px; }
  .room .rn > span:first-child { display: flex; align-items: center; gap: 4px; min-width: 0; hyphens: manual; -webkit-hyphens: manual; }
  .room .rn .ri { font-size: 22px; flex: none; }
  .room .me { position: absolute; top: 6px; right: 6px; font-size: 24px; line-height: 1; }
  .reqs { display: flex; flex-wrap: wrap; gap: 5px; }
  .reqs { gap: 5px; }
  .req { border: 0; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); padding: 6px 4px 7px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: calc(50% - 3px); max-width: 76px; min-width: 62px; outline: 1px solid var(--line); }
  .req .em { font-size: 27px; line-height: 1.05; white-space: nowrap; }
  .req .em small { font-size: 22px; }
  .req .bar { width: 100%; height: 7px; }
  .req.robot { outline: 2px dashed var(--good); }
  .preview { min-height: 20px; font-size: 14px; text-align: center; color: var(--muted); padding-top: 6px; }
  .req.urgent { animation: wobble .4s infinite; }
  .req.coffee { outline-style: dashed; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
  .tiltdown { animation: tilt 3s ease-in-out infinite; }
  @keyframes tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(1.2deg); } }
  .speech { min-height: 22px; font-size: 14px; color: var(--muted); padding: 8px 2px 0; text-align: center; }

  /* mini-game sheet */
  .mini {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bg);
    border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.18);
    padding: 14px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    max-width: 520px; margin: 0 auto; min-height: 46vh;
  }
  .mini .mh { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .mini .face { font-size: 30px; line-height: 1; }
  .mini .ask { flex: 1; font-weight: 650; }
  .mini .ask small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .mini .x { border: 0; background: var(--line); border-radius: 50%; width: 32px; height: 32px; flex: none; }
  .mini .pb { margin-bottom: 12px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { border: 1px solid var(--line); background: var(--card); border-radius: 14px; font-size: 30px; aspect-ratio: 1.25; display: grid; place-items: center; box-shadow: var(--shadow); }
  .tile:disabled { opacity: .35; cursor: default; }
  .tile.hit { background: var(--here); opacity: 1; }
  .tile.lit { background: var(--accent); }
  .tile.shake { animation: shake .3s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .opt2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt2 .tile { font-size: 52px; aspect-ratio: 1; }
  .masher { width: 100%; font-size: 64px; padding: 18px; border-radius: 22px; border: 2px solid var(--accent); background: var(--card); }
  .masher:active { transform: scale(.94); }
  .track { position: relative; height: 54px; border-radius: 14px; background: var(--line); overflow: hidden; margin: 10px 0 14px; }
  .zone { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: .55; }
  .needle { position: absolute; top: -4px; bottom: -4px; width: 6px; margin-left: -3px; background: var(--text); border-radius: 3px; }
  .flash { text-align: center; font-weight: 700; min-height: 24px; margin-top: 10px; }
  .flash.bad { color: var(--bad); } .flash.good { color: var(--good); }
  .replies { display: flex; flex-direction: column; gap: 8px; }

  /* second wave of mini-games */
  .pour { display: flex; justify-content: center; margin-bottom: 14px; }
  .glass { position: relative; width: 96px; height: 150px; border: 4px solid var(--muted); border-top: none; border-radius: 0 0 18px 18px; overflow: hidden; background: var(--card); }
  .juice { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(#ffc04d, #f59a1b); }
  .line-mark { position: absolute; left: 0; right: 0; height: 0; border-top: 3px dashed var(--bad); }
  .hold { width: 100%; padding: 18px; touch-action: none; -webkit-touch-callout: none; }
  .pans { display: flex; gap: 10px; justify-content: center; margin: 4px 0 26px; }
  .pan { position: relative; width: 31%; max-width: 120px; aspect-ratio: 1; border-radius: 50%; background: #2c2c2e; border: 7px solid #4a4a4e; display: grid; place-items: center; padding: 0; }
  .pan .cake { width: 72%; height: 72%; border-radius: 50%; display: block; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
  .pan small { position: absolute; bottom: -24px; left: 0; right: 0; font-size: 13px; color: var(--muted); }
  .pan:disabled { opacity: .55; }
  .big-item { font-size: 72px; text-align: center; line-height: 1.2; margin: 4px 0 10px; }
  .count { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .baskets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .baskets .tile { flex-direction: column; font-size: 30px; aspect-ratio: auto; padding: 10px 0; display: flex; align-items: center; }
  .baskets .tile small { font-size: 12px; color: var(--muted); }
  .tangle svg { width: 100%; height: auto; display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; }
  .plugs { display: grid; grid-auto-flow: column; gap: 8px; }
  .money { text-align: center; font-size: 22px; font-weight: 700; margin: 2px 0 10px; font-variant-numeric: tabular-nums; }
  .coins { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
  .coin { border-radius: 50%; aspect-ratio: 1; border: 2px solid #b8902a; background: radial-gradient(circle at 35% 30%, #ffe9a3, #e0b84a); color: #3a2a05; font-weight: 800; font-size: 13px; padding: 0; }
  .coin.big { border-color: #8d8d8d; background: radial-gradient(circle at 35% 30%, #fff6d0, #c9a43b 55%, #a8a8a8 56%); }
  .guesses { display: flex; flex-direction: column; gap: 4px; align-items: center; margin-bottom: 8px; min-height: 30px; }
  .guess { display: flex; gap: 4px; }
  .guess span { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #fff; }
  .g-ok { background: #3f9d5b; } .g-near { background: #d9a520; } .g-no { background: #7b7f86; }
  .slot-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .slot-row span { width: 40px; height: 40px; border: 2px solid var(--line); border-radius: 10px; display: grid; place-items: center; font-size: 20px; font-weight: 800; }
  .digits { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .digits .tile { font-size: 20px; font-weight: 800; aspect-ratio: 1; }
  .order { text-align: center; font-size: 30px; letter-spacing: 2px; background: var(--here); border-radius: 12px; padding: 6px; margin-bottom: 8px; }
  .built { text-align: center; font-size: 26px; min-height: 36px; margin-bottom: 8px; }
  .diffs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .diffs .grid3 { gap: 4px; }
  .diffs .tile { font-size: 22px; aspect-ratio: 1; }
  .diffs .left .tile { cursor: default; }
  .field { position: relative; height: 230px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); overflow: hidden; touch-action: none; margin-bottom: 4px; }
  .field .toast-fly { position: absolute; font-size: 32px; transform: translate(-50%, -50%); pointer-events: none; }
  .field .plate { position: absolute; bottom: 4px; font-size: 44px; transform: translateX(-50%); pointer-events: none; }
  .field .score { position: absolute; top: 6px; right: 10px; font-size: 14px; color: var(--muted); font-weight: 700; }

  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--bg); width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 20px max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .sheet h3 { font-size: 22px; margin-bottom: 12px; }
  .up { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .up .i { font-size: 28px; }
  .up .t { flex: 1; min-width: 0; }
  .up .t b { display: block; }
  .up .t span { font-size: 13px; color: var(--muted); }
  .up .btn { padding: 8px 12px; font-size: 14px; white-space: nowrap; }
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 64px); transform: translateX(-50%); z-index: 20; background: var(--text); color: var(--bg); padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 650; max-width: calc(100% - 32px); text-align: center; animation: toast 2.8s forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 8%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .req.urgent, .tiltdown { animation: none; } }
</style>
</head>

// ===================== game =====================
let game = null, raf = 0;
function stopGame() { cancelAnimationFrame(raf); game = null; document.querySelector('.mini')?.remove(); }

function poolFor(weeks) {
  return Object.keys(REQ).filter(id => !REQ[id].only && (!REQ[id].weeks || REQ[id].weeks.some(w => weeks.includes(w))));
}
function plan(d) {
  const ev = EVENTS[d], w = weekOf(d);
  const pool = poolFor([w]);
  const count = Math.round((6 + d * 0.55) * (P.nightmare ? 1.25 : 1));
  const forced = Object.keys(REQ).filter(id => REQ[id].special && REQ[id].special === ev).slice(0, 3);
  const ids = [];
  const used = {};
  while (ids.length < count - forced.length) {
    let cand = pickOne(pool);
    if (ev === 'wfh' && Math.random() < .45) cand = pickOne(pool.filter(id => REQ[id].who === 'mauro'));
    if (w === 4 && Math.random() < .35) cand = pickOne(pool.filter(id => REQ[id].who === 'grandma' && !(forced.includes(id))));
    if ((used[cand] || 0) >= 1 && Math.random() < .85) continue;
    used[cand] = (used[cand] || 0) + 1;
    ids.push(cand);
  }
  // spread forced specials through the middle of the morning
  forced.forEach((id, i) => ids.splice(Math.floor(ids.length * (0.3 + 0.2 * i)), 0, id));
  return ids;
}

function startGame(d) {
  stopGame();
  const endless = d === 'endless';
  const lvl = endless ? 6 : d;          // endless starts like a Wednesday and ramps up
  const ev = endless ? null : EVENTS[d];
  let dur = endless ? Infinity : 100 + d * 1.5;
  if (ev === 'lateBus') dur *= 0.85;
  if (has('calendar') && !endless) dur += 10;
  let pat = 16 - lvl * 0.3;
  if (ev === 'calm') pat *= 1.25;
  if (ev === 'slowWifi') pat *= 0.8;
  if (has('headphones')) pat *= 1.15;
  if (P.nightmare && !endless) pat *= 0.75;
  const ids = endless ? [] : plan(d);
  const span = dur * 0.8;
  game = {
    d, lvl, ev, dur, pat, endless, nightmare: P.nightmare && !endless, t: 0, last: performance.now(),
    queue: ids.map((id, i) => ({ id, at: 1.5 + i * span / ids.length + Math.random() * (span / ids.length) * 0.6 })),
    total: ids.length, active: [], done: 0, fails: [],
    room: 'kitchen', moving: null, sanity: 100, emptied: false, everEmpty: false,
    // coffee drains twice as fast as in the first version (the meter lasts half as long)
    decay: 2 * (0.7 + lvl * 0.04) * (has('espresso') ? 0.75 : 1),
    powerUntil: ev === 'powerCut' ? dur * 0.6 : 0,
    grandma: has('grandma') ? 1 : 0, groupChat: has('groupChat') ? 1 : 0, thermos: has('thermos') ? 1 : 0,
    nextSpawn: 1.5, mini: null, dirty: true, uid: 0
  };
  if (endless) {
    game.endlessPool = poolFor(has('grandmaWeek') ? [0, 1, 2, 3, 4] : [0, 1, 2, 3]);
    game.nextId = pickOne(game.endlessPool);
  }
  renderGame();
  raf = requestAnimationFrame(loop);
}

// A fresh times-table question, with a believable wrong answer next to the right one.
function mathQuestion() {
  const a = 3 + (Math.random() * 10 | 0), b = 3 + (Math.random() * 10 | 0), ans = a * b;
  let wrong;
  do wrong = ans + pickOne([-b, b, -a, a, -1, 1, 10, -10]); while (wrong <= 0 || wrong === ans);
  return { a, b, ans, wrong };
}

function spawn(id) {
  const g = game, def = REQ[id];
  let p = g.endless ? Math.max(7, g.pat - g.t * 0.03) : g.pat;
  p *= 0.85 + Math.random() * 0.3;
  if (g.ev === 'fight' && def.room === 'bath') p *= 0.6;
  if (def.special) p *= 1.4;
  if (def.slow) p *= def.slow;
  const r = { uid: ++g.uid, id, def, max: p, left: p };
  if (has('robot') && CLEANING.includes(id)) r.robotAt = g.t + 3.5;
  if (id === 'homework') r.vars = mathQuestion();
  g.active.push(r);
  g.dirty = true;
}

function loop(now) {
  const g = game;
  if (!g) return;
  const dt = Math.max(0, Math.min(0.1, (now - g.last) / 1000));
  g.last = now;
  g.t += dt;
  // spawn
  while (g.queue.length && g.queue[0].at <= g.t) spawn(g.queue.shift().id);
  if (g.endless && g.t >= g.nextSpawn) {
    // ever faster: one request every ~6s at first, down to ~2s
    spawn(g.nextId);
    g.total++;
    g.nextId = pickOne(g.endlessPool);
    if (g.active.some(r => r.id === g.nextId)) g.nextId = pickOne(g.endlessPool);
    g.nextSpawn = g.t + Math.max(2, 6 - g.t * 0.025) * (0.8 + Math.random() * 0.4);
  }
  // robot vacuum finishes cleaning jobs on its own
  for (const r of g.active.slice()) {
    if (r.robotAt && g.t >= r.robotAt && !(g.mini && g.mini.req === r)) { resolveReq(r); toast(U.robotOn); }
  }
  // patience
  const mult = g.sanity <= 0 ? 2 : 1;
  for (const r of g.active.slice()) {
    if (g.mini && g.mini.req === r && g.mini.paused) continue;
    r.left -= dt * mult;
    if (r.left <= 0) failReq(r);
  }
  // sanity
  g.sanity = Math.max(0, g.sanity - g.decay * dt);
  if (g.sanity <= 0 && g.thermos) { g.thermos = 0; g.sanity = 50; toast(U.thermosUsed); }
  if (g.sanity <= 0 && !g.emptied) { g.emptied = true; g.everEmpty = true; toast(U.lowCoffee); g.dirty = true; }
  if (g.powerUntil && g.t >= g.powerUntil) { g.powerUntil = 0; g.dirty = true; }
  // travel
  if (g.moving && g.t >= g.moving.until) {
    g.room = g.moving.to;
    const then = g.moving.then;
    g.moving = null; g.dirty = true;
    if (then) then();
  }
  // end?
  if (g.endless ? g.fails.length >= 3 : (g.t >= g.dur || (!g.queue.length && !g.active.length))) return endGame();
  if (g.dirty) { renderHouse(); g.dirty = false; }
  updateBars();
  raf = requestAnimationFrame(loop);
}

function failReq(r) {
  const g = game;
  g.active = g.active.filter(x => x !== r);
  g.fails.push(r.id);
  toast('💥 ' + L.req[r.id].fail);
  if (g.mini && g.mini.req === r) closeMini();
  g.dirty = true;
}
function resolveReq(r) {
  const g = game;
  if (!g || !g.active.includes(r)) return;
  g.active = g.active.filter(x => x !== r);
  g.done++;
  g.dirty = true;
}

function travel(to, then) {
  const g = game;
  if (g.moving) return;
  if (g.room === to) return then();
  const a = ROOMS.find(x => x.id === g.room), b = ROOMS.find(x => x.id === to);
  const dist = Math.abs(a.c - b.c) + Math.abs(a.r - b.r);
  g.moving = { to, until: g.t + dist * 0.35 * (has('sneakers') ? 0.55 : 1), then };
  g.dirty = true;
}

function renderGame() {
  app.innerHTML = '';
  const hud = el('div', 'hud');
  hud.append(btn('pill', '✕', () => { if (confirm(U.quit + '?')) showCalendar(); }));
  hud.append(el('div', 'clock', '7:30'));
  const m = el('div', 'meter', `<small>☕ ${esc(U.coffee)}</small><div class="bar"><i></i></div>`);
  hud.append(m);
  if (game.groupChat) hud.append(btn('pill groupchat', '💬', useGroupChat));
  if (game.grandma) hud.append(btn('pill grandma', '👵', useGrandma));
  app.append(hud);
  app.append(el('div', 'house'));
  if (has('speaker')) app.append(el('div', 'preview'));
  const label = game.endless ? `♾️ ${U.endless} · ${fmt(U.endlessBest, { n: P.best })}`
    : (game.nightmare ? '🌪️ ' : '') + L.days[game.d % 5] + (game.ev ? ' · ' + L.events[game.ev] : '');
  app.append(el('div', 'speech', esc(label)));
  renderHouse();
}

function useGroupChat() {
  const g = game;
  if (!g.groupChat) return;
  g.groupChat = 0;
  for (const r of g.active) r.left = r.max;
  toast(U.groupChatUsed);
  app.querySelector('.groupchat')?.remove();
}

function renderHouse() {
  const g = game;
  const house = app.querySelector('.house');
  if (!house) return;
  house.innerHTML = '';
  house.classList.toggle('tiltdown', g.sanity <= 0);
  for (const room of ROOMS) {
    const here = !g.moving && g.room === room.id;
    const tile = el('div', 'room' + (here ? ' here' : '') + (g.moving && g.moving.to === room.id ? ' going' : ''));
    tile.append(el('div', 'rn', `<span><span class="ri">${room.icon}</span>${esc(L.rooms[room.id])}</span><span class="me">${here ? '🙋‍♀️' : (g.moving && g.moving.to === room.id ? '🏃‍♀️' : '')}</span>`));
    const reqs = el('div', 'reqs');
    for (const r of g.active.filter(x => x.def.room === room.id)) {
      const b = btn('req' + (r.robotAt ? ' robot' : ''), `<span class="em">${r.robotAt ? '🤖' : FACE[r.def.who]}<small>${r.def.icon}</small></span><span class="bar"><i></i></span>`, () => openReq(r));
      b.dataset.uid = r.uid;
      reqs.append(b);
    }
    if (room.id === 'kitchen') {
      const off = g.t < g.powerUntil;
      const b = btn('req coffee', `<span class="em">☕<small>${off ? '🔌' : ''}</small></span><span class="bar" style="visibility:hidden"><i></i></span>`, () => openCoffee());
      b.disabled = off;
      b.title = off ? U.coffeeOff : U.coffee;
      reqs.append(b);
    }
    tile.append(reqs);
    tile.onclick = e => { if (e.target === tile || e.target.closest('.rn')) travel(room.id, () => {}); };
    house.append(tile);
  }
}

function updateBars() {
  const g = game;
  const clock = app.querySelector('.clock');
  if (clock && g.endless) {
    clock.textContent = `✓${g.done} ${'💥'.repeat(g.fails.length)}`;
  } else if (clock) {
    const mins = g.t / g.dur * 5, mm = Math.floor(mins), ss = Math.floor((mins - mm) * 60);
    clock.textContent = `7:${String(30 + mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    clock.classList.toggle('hot', mins > 4);
  }
  const pv = app.querySelector('.preview');
  if (pv) {
    const nextId = g.endless ? g.nextId : g.queue[0]?.id;
    const txt = nextId ? fmt(U.speakerNext, { face: FACE[REQ[nextId].who] + REQ[nextId].icon, room: L.rooms[REQ[nextId].room] }) : '';
    if (pv.textContent !== txt) pv.textContent = txt;
  }
  const sb = app.querySelector('.meter .bar i');
  if (sb) { sb.style.width = g.sanity + '%'; sb.style.background = g.sanity > 50 ? 'var(--good)' : g.sanity > 20 ? 'var(--warn)' : 'var(--bad)'; }
  for (const r of g.active) {
    const b = app.querySelector(`.req[data-uid="${r.uid}"]`);
    if (!b) continue;
    const f = r.left / r.max;
    const i = b.querySelector('.bar i');
    i.style.width = (f * 100) + '%';
    i.style.background = f > .5 ? 'var(--good)' : f > .25 ? 'var(--warn)' : 'var(--bad)';
    b.classList.toggle('urgent', f < .25);
  }
}

function useGrandma() {
  const g = game;
  if (!g.grandma) return;
  // Grandma takes over whatever Julie is doing right now; otherwise the most urgent request.
  if (g.mini) {
    const r = g.mini.req;
    closeMini();
    if (r) resolveReq(r);
    else { g.sanity = 100; g.emptied = false; g.dirty = true; } // she was at the coffee machine
  } else {
    if (!g.active.length) return;
    resolveReq(g.active.slice().sort((a, b) => a.left - b.left)[0]);
  }
  g.grandma = 0;
  toast(U.grandmaUsed);
  app.querySelector('.grandma')?.remove();
}

// ===================== mini-games =====================
function closeMini() {
  if (game) game.mini = null;
  document.querySelector('.mini')?.remove();
}
function openReq(r) {
  const g = game;
  if (g.mini || g.moving) return;
  travel(r.def.room, () => {
    if (!game || !g.active.includes(r) || g.mini) return;
    openMini(r);
  });
}
function openCoffee() {
  const g = game;
  if (g.mini || g.moving || g.t < g.powerUntil) return;
  travel('kitchen', () => {
    if (!game || g.mini) return;
    openMini(null);
  });
}

function openMini(r) {
  const g = game;
  const box = el('div', 'mini');
  g.mini = { req: r };
  const who = r ? r.def.who : 'julie';
  const ask = r ? fmt(L.req[r.id].ask, r.vars || {}) : U.coffee;
  const head = el('div', 'mh');
  head.append(el('div', 'face', FACE[who]), el('div', 'ask', `${esc(ask)}<small></small>`), btn('x', '✕', closeMini));
  box.append(head);
  const sub = head.querySelector('small');
  const body = el('div');
  const flash = el('div', 'flash');
  box.append(body, flash);
  document.body.append(box);
  const say = (txt, cls) => { flash.className = 'flash ' + (cls || ''); flash.textContent = txt; };
  const win = msg => {
    say(msg || U.done, 'good');
    body.querySelectorAll('button').forEach(b => b.disabled = true);
    setTimeout(() => {
      if (!game || game.mini?.req !== r || !document.body.contains(box)) return;

}

  flip({ r, body, sub, say, win }) {
    sub.textContent = U.flipTitle;

    const mixC = (a, b, t) => `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, t)))).join(',')})`;
    for (let i = 0; i < (game.lvl >= 10 ? 3 : 2); i++) {

  diff({ r, body, sub, say, win }) {
    sub.textContent = U.diffTitle;
    const pool = shuffle(['🪴', '📚', '🕰️', '🧸', '🖼️', '🕯️', '🏺', '📻', '🧶', '🍵', '🎀', '📷', '🧁', '🌵']);
    const left = pool.slice(0, 9), spare = pool.slice(9);
    const changed = shuffle([...Array(9).keys()]).slice(0, 3);
    const right = left.slice();
    changed.forEach((idx, j) => right[idx] = spare[j]);
    let found = 0;
    const leftGrid = el('div', 'grid3'), rightGrid = el('div', 'grid3');
    left.forEach(x => leftGrid.append(el('div', 'tile', x)));
    right.forEach((x, idx) => rightGrid.append(btn('tile', x, e => {
      const b = e.currentTarget;
      if (changed.includes(idx)) { b.classList.add('hit'); b.disabled = true; if (++found === 3) win(); }
      else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); hurt(r, 0.6); }
    })));
    const wrap = el('div', 'diffs');
    const lw = el('div', 'left'); lw.append(leftGrid);
    const rw = el('div'); rw.append(rightGrid);
    wrap.append(lw, rw);
    body.append(wrap);
  },

  catch({ r, body, sub, say, win }) {
    sub.textContent = U.catchTitle;
    const field = el('div', 'field'), plate = el('div', 'plate', '🍽️'), score = el('div', 'score');
    field.append(plate, score);
    body.append(field);
    const need = 5 + Math.floor(game.lvl / 6), speed = 0.42 + game.lvl * 0.012;
    let px = 0.5, caught = 0, flying = [], nextAt = 0.4, t = 0, last = performance.now(), done = false;
    const move = e => { const b = field.getBoundingClientRect(); px = Math.max(0.08, Math.min(0.92, (e.clientX - b.left) / b.width)); };
    field.addEventListener('pointermove', move);
    field.addEventListener('pointerdown', e => { move(e); field.setPointerCapture?.(e.pointerId); });
    const tick = now => {
      if (!document.body.contains(field) || done) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
      if (t >= nextAt) {
        const e = el('div', 'toast-fly', Math.random() < 0.12 ? '🥐' : '🍞');
        field.append(e);
        flying.push({ e, x: 0.1 + Math.random() * 0.8, y: -0.05 });
        nextAt = t + Math.max(0.6, 1.2 - game.lvl * 0.02) * (0.7 + Math.random() * 0.6);
      }
      for (const f of flying.slice()) {
        f.y += dt * speed;
        f.e.style.left = f.x * 100 + '%'; f.e.style.top = f.y * 100 + '%';
        if (f.y >= 0.82 && f.y < 0.95 && Math.abs(f.x - px) < 0.14) {
          f.e.remove(); flying = flying.filter(x => x !== f);
          if (++caught >= need) { done = true; score.textContent = `${caught}/${need}`; return win(); }
        } else if (f.y > 1.05) {
          f.e.remove(); flying = flying.filter(x => x !== f);
          say(U.catchMiss, 'bad'); hurt(r, 0.8);
        }
      }
      plate.style.left = px * 100 + '%';
      score.textContent = `🍞 ${caught}/${need}`;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
};
// Laundry: whose clothes are these?
const SORT_ITEMS = { margot: ['🎽', '🩳', '👟', '🥅'], anouk: ['👗', '👠', '👒', '🧣', '👜'], mauro: ['👔', '🧦', '👞', '🩲'] };
// A wrong move costs a little patience, but never fails the request outright.
const hurt = (r, s) => { r.left = Math.max(0.5, r.left - s); };

// ===================== results =====================
function disastersEl(fails) {
  const box = el('div', 'stack');
  box.append(el('div', 'muted', `<b>${esc(U.disasters)}</b>`));
  if (!fails.length) box.append(el('div', 'disaster', esc(U.noDisaster)));
  // every disaster, in the order it happened; repeats of the same kind get a count
  const count = {};
  fails.forEach(id => count[id] = (count[id] || 0) + 1);
  for (const id of Object.keys(count)) box.append(el('div', 'disaster', `${FACE[REQ[id].who]}${REQ[id].icon} ${esc(L.req[id].fail)}${count[id] > 1 ? ` <b>×${count[id]}</b>` : ''}`));
  box.style.gap = '6px';
  return box;
}

function endGame() {
  const g = game;
  stopGame();
  app.innerHTML = '';
  const sc = el('div', 'screen');
  const c = el('div', 'card stack');

  if (g.endless) {
    const coins = g.done * 2;
    const record = g.done > P.best;
    P.best = Math.max(P.best, g.done);
    P.coins += coins;
    saveP();
    c.append(el('div', 'muted center', '♾️ ' + esc(U.endless)));
    c.append(el('h2', 'center', esc(U.endlessOver)));
    c.append(el('div', 'stars', (record ? '🏆 ' : '') + g.done));
    c.append(el('div', 'center', `${esc(fmt(U.endlessScore, { n: g.done }))} · ${esc(fmt(U.endlessBest, { n: P.best }))} · 🪙 ${esc(fmt(U.earned, { c: coins }))}`));
    c.append(disastersEl(g.fails));
    const row = el('div', 'row');
    row.append(btn('btn primary', esc(U.retry), () => startGame('endless')), btn('btn', `🗓️ ${esc(U.menu)}`, showCalendar));
    c.append(row);
    sc.append(c);
    app.append(sc);
    return;
  }

  const ratio = g.done / g.total;
  const stars = ratio >= 1 && !g.everEmpty ? 3 : ratio >= 0.8 ? 2 : ratio >= 0.5 ? 1 : 0;
  const coins = (g.done * 3 + stars * 5) * (g.nightmare ? 2 : 1);
  const firstClear = stars > 0 && P.stars[g.d] === 0;
  P.stars[g.d] = Math.max(P.stars[g.d], stars);
  P.coins += coins;
  saveP();

  c.append(el('div', 'muted center', (g.nightmare ? '🌪️ ' : '') + esc(dayLabel(g.d))));
  c.append(el('h2', 'center', esc(stars > 0 ? U.outTime : U.late)));
  c.append(el('div', 'stars', '⭐'.repeat(stars) + '☆'.repeat(3 - stars)));
  c.append(el('div', 'center', `${esc(fmt(U.helped, { n: g.done, t: g.total }))} · 🪙 ${esc(fmt(U.earned, { c: coins }))}`));
  c.append(disastersEl(g.fails));
  const row = el('div', 'row');
  row.append(btn('btn', esc(U.retry), () => startGame(g.d)));
  if (g.d < DAYS - 1 && unlocked(g.d + 1)) row.append(btn('btn primary', esc(U.next), () => showIntro(g.d + 1)));
  c.append(row);
  c.append(btn('btn', `🗓️ ${esc(U.menu)}`, showCalendar));
  sc.append(c);
  app.append(sc);
  if (g.d === MAIN_DAYS - 1 && firstClear) setTimeout(showFinal, 600);
}

function showFinal() {
  stopGame();
  P.finalSeen = true; saveP();
  const s = totalStars();
  const rank = U.ranks[s < 25 ? 0 : s < 40 ? 1 : s < 52 ? 2 : 3];
  app.innerHTML = '';
  const sc = el('div', 'screen');
  const c = el('div', 'card stack center');
  c.append(el('div', '', '<span style="font-size:64px">🏖️</span>'), el('h2', '', esc(U.finalTitle)), el('p', '', esc(fmt(U.finalText, { s }))));
  c.append(el('div', 'muted', esc(U.rank)), el('h2', '', '👑 ' + esc(rank)));
  c.append(btn('btn primary', `🗓️ ${esc(U.menu)}`, showCalendar));
  sc.append(c);
  app.append(sc);
}

document.documentElement.lang = lang;
document.title = U.title;
showTitle();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
